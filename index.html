<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello OpenChoreo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .status {
            margin-top: 20px;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 8px;
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 Hello from OpenChoreo!</h1>

    <p>
        My first application deployed using OpenChoreo.
    </p>

    <div class="status">
        OpenChoreo is working 🎉
    </div>

</div>

</body>
</html>
